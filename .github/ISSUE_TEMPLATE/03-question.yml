name: Question / support
description: Ask for help using or contributing to Repovio.
labels:
  - question
  - documentation
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Search existing issues before submitting. English and German reports are welcome. Remove
        passwords, tokens, cookies, private repository names and sensitive provider data from logs
        and screenshots. Report vulnerabilities privately using the security link in the issue
        chooser.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to achieve, and where are you stuck?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected page or source file
      description: Paste the documentation URL or source path, including version and locale, for example
        en/docs/v0.5/overview.md.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Include relevant documentation and troubleshooting steps.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Add sanitized configuration, logs or screenshots if useful.
    validations:
      required: false
